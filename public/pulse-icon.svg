<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- The browser tab and the home-screen icon now carry the same mark the app
       shows in its sidebar, not a heartbeat line in a colour we do not use. -->
  <defs>
    <linearGradient id="pulse-wave-icon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B8BFF"/>
      <stop offset="35%" stop-color="#7B4CFF"/>
      <stop offset="65%" stop-color="#FF4F8B"/>
      <stop offset="100%" stop-color="#FF7C2D"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="#ffffff"/>
  <!-- The sidebar mark is drawn on a 120x100 canvas. Scaled up and centred, with
       room left around it so it survives the circular crop Android applies. -->
  <g transform="translate(76 106) scale(3)">
    <path d="M8 72 C8 72 20 48 42 42 C58 38 62 50 78 44 C94 38 102 24 108 20 C108 20 104 56 82 68 C66 76 58 62 42 68 C26 74 16 82 8 72Z"
          fill="url(#pulse-wave-icon)"/>
    <path d="M14 68 C14 68 26 50 44 46 C56 43 60 52 72 48"
          stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>
    <circle cx="72" cy="22" r="5" fill="#FF7C2D"/>
    <circle cx="82" cy="14" r="4" fill="#FF7C2D"/>
    <circle cx="64" cy="16" r="3.5" fill="#FF4F8B"/>
    <circle cx="58" cy="24" r="2.5" fill="#FF4F8B" opacity="0.8"/>
    <circle cx="54" cy="16" r="2" fill="#7B4CFF"/>
    <circle cx="48" cy="22" r="1.5" fill="#7B4CFF" opacity="0.7"/>
    <circle cx="90" cy="10" r="3" fill="#FF7C2D" opacity="0.7"/>
  </g>
</svg>
