# Security headers for pulse.augustinnovate.com
#
# Supabase's edge sent these; a self-hosted nginx sends none of them by
# default. Checked on 29 October against the live site and all six were
# absent. None of them is exotic and none costs anything — they are the
# ordinary protections a system holding salaries, PAN numbers and bank
# accounts should have.
#
# Put this inside the `server` block that serves pulse.augustinnovate.com,
# or `include` it from there, then:
#
#     nginx -t && nginx -s reload
#
# Then check: curl -sI https://pulse.augustinnovate.com/login

# ── Force HTTPS for a year, including subdomains ────────────────────────
#
# The site already redirects http to https, but a redirect still means the
# first request of the day goes out in the clear and can be intercepted.
# This tells the browser never to try http again.
#
# Add `preload` only once you are confident: it is very hard to undo.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# ── Nobody frames Pulse ─────────────────────────────────────────────────
#
# Stops a page elsewhere loading Pulse in an invisible frame and collecting
# clicks from somebody who is signed in.
add_header X-Frame-Options "DENY" always;

# ── Browsers must not guess at content types ────────────────────────────
#
# Without this a browser may decide an uploaded file is something more
# interesting than its declared type and run it. Pulse accepts uploads, so
# this one earns its place.
add_header X-Content-Type-Options "nosniff" always;

# ── Do not leak URLs to other sites ─────────────────────────────────────
#
# Pulse URLs carry record identifiers. Without this they travel in the
# Referer header to anything the page links to.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# ── Hardware this app never uses ────────────────────────────────────────
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# ── What the page may load ──────────────────────────────────────────────
#
# The tightest policy Pulse can take today. It is last because it is the one
# that can break a page if something was missed — test the whole app with it
# on before trusting it in front of everybody.
#
#   'unsafe-inline' for styles is needed by the styling the app uses.
#   Scripts are same-origin only; nothing is loaded from a CDN.
#   connect-src is same-origin because the API is served from this host.
#
# If something breaks, the browser console names the directive. Fix the
# directive rather than removing the header.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.blob.core.windows.net; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# ── Stop announcing the version ─────────────────────────────────────────
#
# `server: nginx/1.27.5` tells anybody scanning exactly which advisories to
# look up. Minor, free to remove.
server_tokens off;

# ── A note on `always` ──────────────────────────────────────────────────
#
# Without it, nginx omits these headers on error responses — so a 404 or a
# 500 would come back unprotected. Every line above uses it deliberately.
